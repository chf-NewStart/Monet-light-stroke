version: 7
purpose: >-
  Test whether changes improve painterly behavior without sacrificing source fidelity.

scoring:
  scale: 0-2
  meanings:
    0: fail
    1: partial
    2: pass
  hard_gates:
    - orientation_and_crop
    - subject_and_object_count
    - identity_pose_and_anatomy
    - landmark_geometry
    - dominant_material_spatial_frequency
    - object_material_contact
  painterly_dimensions:
    - painting_first_abstraction
    - light_defined_boundaries_and_edge_hierarchy
    - material_specific_strokes
    - broken_color_and_optical_mixing
    - varied_touch_and_discrete_mark_economy
    - information_weighted_paint_activity
    - within_material_quiet_transition_active_zones
    - layered_oil_construction
    - chromatic_shadows
    - coherent_light
    - condition_appropriate_hue_latitude
    - relational_luminosity_and_atmospheric_envelope
    - source_relative_value_interval_and_depth
  acceptance: >-
    Every hard gate must score 2. The painterly mean must be at least 1.67,
    with no painterly dimension scoring 0.

global_failures:
  - flipped_rotated_zoomed_or_recropped_source
  - invented_removed_duplicated_or_redesigned_people_or_props
  - unapproved_change_outside_a_local_edit_target
  - changed_landmark_architecture_or_viewpoint
  - photograph_with_a_canvas_or_brush_filter
  - one_generic_texture_shared_by_unrelated_materials
  - smooth_digital_gradients_or_globally_blended_color
  - underdefined_forms_without_value_temperature_boundaries
  - uniform_impasto_stipple_mosaic_or_palette_knife_facets
  - broken_color_misread_as_uniform_dots_commas_or_short_dabs
  - paint_activity_distributed_uniformly_or_as_a_photographic_edge_map
  - dominant_material_uses_one_continuous_stamp_frequency_despite_varied_color_or_angle
  - whole_image_contrast_hides_a_locally_uniform_water_sky_field_snow_foliage_or_ground_crop
  - objects_appear_pasted_over_uninterrupted_water_ground_or_atmospheric_texture
  - overdescribed_leaf_petals_clothing_or_architectural_inventory
  - flat_black_shadows_or_hard_ink_contours
  - one_fixed_hue_range_or_automatic_violet_shadow_across_all_conditions
  - canvas_wide_milky_pastel_whitening_or_flat_chalky_shadows
  - source_contradicting_automatic_cool_distance
  - snow_or_fog_rendered_as_an_opaque_white_overlay
  - fixed_motif_series_reduced_to_recolors
  - signature_text_watermark_unrequested_frame_or_photographic_ui
  - missing_clean_painting_or_missing_default_companion_collage_for_photo_transfer
  - collage_panel_repainted_mirrored_recropped_replaced_or_misassigned
  - collage_palette_unrelated_to_source_or_reference_text_ui_copied_without_request
  - collage_frame_flat_mat_printed_border_incomplete_molding_or_gallery_mockup
  - upper_original_has_stroke_keyline_mat_rim_halo_bevel_or_shadow

cases:
  - id: dominant_material_spatial_frequency_and_contact
    source_status: consented_private_local_fixture
    hard_gate: true
    crop_checks:
      - inspect_largest_dominant_material_separately_in_color_and_grayscale
      - require_quiet_body_transitional_passages_and_sparse_active_events_at_normal_size
      - require_broad_mass_and_activity_islands_to_survive_at_thumbnail_size
      - reject_one_recognizable_stamp_family_tiling_most_of_the_material
      - do_not_count_contrast_with_other_materials_as_within_material_modulation
    contact_checks:
      - important_subjects_interrupt_adjacent_material_through_source_supported_physical_evidence
      - water_contacts_use_lapping_wake_reflection_occlusion_wet_seam_or_displaced_flow_as_applicable
      - stationary_subjects_on_exposed_rocks_do_not_receive_generic_concentric_rings
      - contact_evidence_remains_economical_and_does_not_redesign_subjects
    prompt_checks:
      - describe_broad_bodies_and_quiet_passages_before_surface_mark_nouns
      - avoid_long_lists_of_dashes_curls_hooks_facets_ripples_and_impasto_that_imply_full_coverage
      - never_freeze_a_surface_that_has_not_passed_the_material_crop_gate
    known_failure: >-
      A result fails even when whole-image metrics and palette look plausible if
      its largest material crop repeats one short ridge, dash, curl, comma, or
      facet at similar density and relief. It also fails when birds, rocks,
      boats, figures, or architecture sit on an uninterrupted texture without
      wake, lapping, reflection, occlusion, cast color, wet contact, overlap, or
      flow displacement appropriate to the source.

  - id: paired_clean_painting_and_source_colored_collage
    source_status: consented_private_local_fixture
    output_contract:
      - clean_converted_painting_returned_as_its_own_file
      - separate_companion_collage_returned_unless_user_opts_out
      - collage_created_only_after_clean_conversion_passes_factual_and_painterly_checks
    clean_painting_checks:
      - exact_source_orientation_aspect_ratio_crop_and_subject_facts
      - no_frame_mat_wall_glass_label_signature_watermark_text_ui_or_collage_treatment
    collage_checks:
      - original_photo_and_approved_conversion_are_distinct_complete_fixed_panels
      - neither_panel_is_mirrored_rotated_recropped_repainted_substituted_or_misassigned
      - original_photo_is_the_smaller_borderless_upper_panel_and_conversion_is_the_larger_lower_focal_panel_unless_user_requests_another_order
      - upper_original_pixels_meet_graphic_field_directly_without_stroke_keyline_mat_rim_halo_bevel_or_shadow
      - converted_panel_has_complete_museum_frame_with_outer_repeat_rail_dark_cove_raised_ornament_recessed_reveal_and_inner_slip
      - all_four_frame_sides_and_corners_visible_with_consistent_mitres_proportion_relief_patina_and_light_direction
      - frame_is_isolated_on_graphic_field_without_wall_room_label_glass_easel_hardware_hand_or_gallery_mockup
      - dominant_source_color_family_governs_the_background_field
      - restrained_source_focal_or_counter_color_supplies_accents
      - source_tinted_light_neutral_supplies_linework_or_keylines
      - decoration_is_sparse_subject_related_and_confined_to_negative_space
      - supplied_layout_reference_guides_hierarchy_without_copying_its_text_ui_logo_or_subject_matter
      - no_invented_title_location_date_caption_logo_watermark_extra_photo_frame_mockup_wall_or_hand
    known_failure: >-
      The paired output fails when only the collage is returned, when the clean
      artwork is embedded in a frame or graphic layout instead of also being
      delivered clean, when either panel is regenerated or cropped to fit, when
      the original and conversion hierarchy is reversed without instruction,
      when the upper original receives any pale outline, mat, rim, halo, bevel,
      or panel shadow, when the lower frame is a flat mat, printed border, neon metallic strip,
      incomplete molding, inconsistent corner construction, or full gallery
      mockup; when a generic unrelated palette replaces the source-derived
      field; or when text and interface motifs are copied from the layout
      example without a request.

  - id: open_sea_sunset_subject
    benchmark: B001
    source_status: private_local_fixture
    invariants:
      - subject_count_orientation_and_placement
      - horizon_wave_bands_and_light_direction
      - original_crop_and_aspect_ratio
    material_checks:
      water: continuous_body_with_irregular_arcing_hooked_and_dragged_wave_marks
      foam: sparse_broken_ribbons_not_white_frosting
      focal_subject: readable_chromatic_anchor_without_black_cutout

  - id: painted_dusk_sky_and_cacti
    benchmarks: [B002, B005]
    source_status: private_local_fixture
    invariants:
      - cactus_count_silhouettes_overlap_and_placement
      - skyline_mountain_ridge_and_light_direction
      - original_crop_and_orientation
    material_checks:
      sky: quiet_broad_scumbles_with_visible_broken_gray_blue_lavender_rose_and_coral_color
      cacti: elongated_rib_following_marks_with_selected_breathing_edges_and_deep_chromatic_cores
      town: compressed_lower_contrast_planar_marks_with_reduced_edge_certainty
      ground: broad_clustered_dragged_broken_field
    hierarchy_checks:
      - quiet_sky_gives_active_foreground_room_to_breathe
      - edge_sharpness_contrast_and_mark_count_fall_with_distance
      - material_state_distance_and_scale_route_the_marks
    superseded_comparison: superseded-005-active-surface-cactus-dusk.png
    rejected_comparison: rejected-005-overblended-cactus-dusk.png

  - id: night_house_architecture_and_ground
    benchmark: B003
    source_status: private_local_fixture
    invariants:
      - exact_upright_orientation_and_portrait_crop
      - exactly_two_small_figures_at_source_positions
      - spire_stair_railing_platform_and_building_geometry
      - sea_horizon_ground_plane_and_light_placement
    material_checks:
      sky: broad_quiet_chromatic_dark_scumbles
      architecture: faithful_planar_horizontal_and_vertical_anchors
      ground: coarse_approximate_broken_value_field_without_precise_stones
      figures: concise_distant_chromatic_anchors
    known_failure: >-
      Attractive paint handling is still rejected if stairs, spires, openings,
      viewpoint, or people are redesigned.

  - id: calm_reflective_water_and_foliage
    benchmark: B004
    source_status: replace_with_open_access_fixture
    invariants:
      - major_verticals_and_reflection_anchors
      - light_direction_and_value_hierarchy
    material_checks:
      air: quiet_gray_lavender_field
      foliage: clustered_neighboring_olive_yellow_green_emerald_and_blue_green
      reflections: vertical_color_echoes_broken_by_horizontal_water_marks
      color: selective_relational_chroma_not_global_brightness

  - id: cool_daylight_ferry_and_foreground_gull
    benchmark: B021
    source_status: consented_private_local_fixture
    invariants:
      - original_wide_crop_orientation_horizon_and_viewpoint
      - exactly_one_large_foreground_gull_with_source_scale_pose_facing_and_bottom_crop
      - exactly_one_upper_left_ferry_with_source_scale_geometry_facing_and_placement
      - passenger_count_impression_distribution_and_complete_visible_extent
      - shoreline_tree_building_and_mast_order
    material_checks:
      sky: broad_rubbed_veils_and_long_scumbles_not_water_dashes_or_blank_gradient
      water: continuous_blue_green_body_with_sparse_depth_scaled_lateral_oblique_gestures_and_quiet_intervals
      ferry: compact_white_navy_planes_with_smokestack_cabin_masts_and_interrupted_structural_anchors_not_drafted_inventory
      passengers: tiny_irregular_chromatic_clumps_not_faces_or_equal_detail
      gull: connected_tinted_light_and_chromatic_shadow_planes_with_tail_and_leg_anchors_not_feather_inventory
      shoreline: compressed_soft_band_subordinate_to_ferry_gull_and_water
      text: no_invented_readable_or_pseudo_lettering_on_vessel_or_scene
    retry_checks:
      - return_to_original_and_freeze_factual_composition
      - correct_material_routing_depth_scale_and_signage_only
      - do_not_edit_forward_from_a_failed_derivative
    known_failure: >-
      The result fails when sky and water share an all-over short-stroke texture,
      when the lake repeats one dash size or density from foreground to horizon,
      when ferry identity depends on pseudo-lettering, when passengers become
      facial inventory, or when the foreground gull is redesigned, moved, or
      described feather by feather. A targeted retry must preserve the source
      skeleton and change only the diagnosed paint behavior or unwanted text.

  - id: full_body_outdoor_portrait
    source_status: consented_private_local_fixture
    invariants:
      - identity_expression_and_body_proportions
      - complete_visible_head_hands_legs_and_shoes
      - outfit_props_and_surroundings
      - source_subject_count_crop_and_camera_angle
    material_checks:
      face: connected_warm_and_cool_planes_with_only_essential_features
      clothing: broader_marks_with_preserved_color_identity
      background: lower_contrast_and_more_abstract_than_the_figure
    known_failure: >-
      A stronger facial likeness does not compensate for zooming into a
      headshot, losing shoes, changing pose, or inventing people.

  - id: flower_house_relational_luminosity
    benchmarks: [B004, B010, B014]
    rejected_calibrations: [R009, R012, R013, R015]
    source_status: private_local_fixture
    invariants:
      - house_silhouette_roof_pitch_openings_and_orientation
      - foliage_and_blossom_mass_placement
      - source_time_weather_crop_and_light_direction
    material_checks:
      architecture: broad_light_and_chromatic_shadow_planes_with_few_interrupted_anchors_not_parallel_siding
      foliage: connected_growth_and_blossom_masses_with_sparse_accents_not_stippled_inventory
      color: selective_clean_pigment_and_deep_chromatic_anchors_not_shared_white
      atmosphere: sky_and_reflected_colors_cross_selected_house_and_foliage_edges
    known_failure: >-
      A mechanically looser house still fails when every material shares the
      same opaque baby-blue, lime, or cotton-pink lightness, or when softened
      edges do not create a continuous chromatic envelope around the building.
      It also fails when parallel siding, clean gutters, window grids, or many
      equal leaf and blossom marks carry the description before the large
      light, house, and foliage masses.

  - id: atmospheric_meadow_figure
    benchmarks: [B016, B020]
    source_status: consented_private_local_fixture
    invariants:
      - original_landscape_crop_orientation_and_meadow_extent
      - figure_count_placement_pose_body_direction_and_complete_visible_extent
      - white_dress_dark_hair_bag_phone_and_distant_tree_band
    material_checks:
      meadow: connected_green_rust_violet_and_muted_flower_masses_built_from_long_low_drags_lateral_scrapes_rubbed_stains_and_soft_mergers_with_sparse_unequal_accents
      figure: integrated_warm_cool_planes_with_chromatic_dark_core_and_environmental_edge_exchange
      clothing: two_to_four_connected_planes_and_one_or_two_broad_fold_gestures_not_ruffle_inventory
      distance: softer_lower_contrast_tree_band_with_fewer_marks
    known_failure: >-
      Figure integration still fails when the person becomes a smooth protected
      sticker. Clothing simplification still fails when it changes the dress
      silhouette or movement; clothing definition still fails when repeated
      ruffles, pleats, seams, printed details, or sharp dark grooves return. The
      meadow still fails when a pale palette disguises an evenly distributed
      carpet of dots, commas, flower spikes, or same-sized short dabs. B020 is
      the preferred positive calibration for broad lateral meadow construction;
      B016 remains useful for sparse accents and distant-band recession.

  - id: dark_chromatic_close_floral
    benchmark: B017
    source_status: private_local_fixture
    invariants:
      - original_portrait_crop_orientation_and_plant_arrangement
      - focal_white_flower_pale_buds_coral_cascades_and_major_leaf_placement
      - no_vase_tabletop_frame_glass_signature_text_or_ui
    material_checks:
      focal_flower: selective_cream_impasto_warm_center_and_clearer_edges
      foliage: five_to_seven_connected_masses_with_simple_light_shadow_boundaries_not_vein_inventory
      blossoms: connected_coral_clouds_with_sparse_petals_not_equal_detail
      background: deep_chromatic_vertical_interwoven_strokes_not_black_smooth_wallpaper_or_horizontal_sweeps
    known_failure: >-
      Simplifying leaves still fails when all boundaries disappear into one
      green cloud; defining them still fails when veins, serrations, glossy
      highlights, or repeated internal marks return. The intended midpoint is
      broad light and chromatic-shadow planes with selective lost edges.

  - id: chromatic_snow_and_thaw
    source_status: needs_open_access_fixture
    invariants:
      - snow_extent_slope_tracks_and_melt_boundaries
      - tree_roof_rail_figure_and_water_anchors
      - source_value_compression_light_direction_crop_and_orientation
    material_checks:
      snow: broad_connected_source_colored_planes_not_pure_white_fill_or_crystal_stipple
      shadow_and_tracks: sparse_directional_chromatic_bands_with_exposed_undercolor_not_blue_outlines
      thaw: wet_horizontal_or_gravity_led_channels_with_warmer_exposed_earth_notes
      anchors: economical_chromatic_darks_with_selected_edges_consumed_by_glare_or_moisture
      depth: lower_contrast_edge_certainty_and_detail_without_automatic_cool_temperature
    known_failure: >-
      Snow still fails when pure white and cyan replace its relational color,
      every drift receives a contour, or foreground and distance share one
      glittering granular stamp. Value compression must survive the repaint.

  - id: fog_steam_and_partial_landmarks
    source_status: needs_open_access_fixture
    invariants:
      - landmark_placement_scale_and_partial_visibility
      - vapor_source_and_direction_of_drift
      - source_value_interval_light_direction_crop_and_orientation
    material_checks:
      vapor: connected_source_colored_scumbles_with_changing_opacity_and_direction
      landmarks: appear_disappear_and_return_without_moving_or_redesigning_geometry
      anchors: few_chromatic_silhouettes_and_reflections_not_full_scene_contrast
      atmosphere: selective_occlusion_not_uniform_milky_blur
    known_failure: >-
      Fog or steam still fails when it is a white overlay on a finished sharp
      scene, when every object remains equally visible through it, or when lost
      edges are recovered by black outlines or invented contrast.

  - id: fixed_motif_light_series
    source_status: needs_open_access_series_fixture
    invariants:
      - subject_viewpoint_crop_orientation_and_landmark_geometry
      - recognizable_material_specific_stroke_grammar
      - requested_condition_is_the_only_scene_level_change
    variation_checks:
      - dominant_value_interval_rebuilt_for_each_condition
      - edge_survival_visibility_and_atmospheric_occlusion_change_with_light
      - shadow_and_reflection_shapes_respond_to_the_condition
      - color_dominance_and_bounded_counter_notes_change_relationally
      - hue_latitude_narrows_or_widens_with_the_observed_condition
      - paint_activity_loading_and_visible_mark_pattern_are_new_each_time
    known_failure: >-
      A series fails when every image preserves one tonal map, reflection shape,
      edge pattern, or visible texture and merely rotates the palette. Structural
      light behavior must change while the factual motif remains fixed.

  - id: historical_handling_modes
    source_status: needs_open_access_fixture
    invariants:
      - subject_viewpoint_crop_orientation_and_landmark_geometry
      - source_time_weather_light_direction_and_color_identities
      - subject_count_identity_pose_props_and_complete_visible_extent
    requested_variants:
      early_tighter:
        - firmer_planar_anchors_smaller_transitions_and_calmer_loading
        - visible_chromatic_touch_without_smooth_academic_or_sepia_finish
      classic_middle:
        - broad_connected_masses_directed_broken_color_and_selective_impasto
        - balanced_legibility_and_atmospheric_edge_loss
      broad_late:
        - larger_juicier_overlapping_passages_and_fewer_descriptive_contours
        - shallow_all_over_organization_only_when_source_geometry_permits
    shared_checks:
      - mode_changes_edge_scale_loading_overlap_and_description_together
      - no_mode_is_a_global_texture_filter_or_antique_color_grade
      - no_requested_mode_changes_source_facts_or_invents_removes_a_horizon
    known_failure: >-
      A handling-mode variant fails when it changes only texture or color grade,
      when early becomes smooth academic realism, when classic middle becomes a
      uniform dash carpet, or when late handling deletes source geometry and
      subjects to imitate an all-over pond. Historical handling changes the
      paint system, never the factual contract.

  - id: horizonless_water_lily_reflection_field
    source_status: needs_open_access_fixture
    invariants:
      - original_horizonless_crop_orientation_and_reflection_paths
      - lily_pad_and_blossom_mass_placement
      - source_depth_ambiguity_and_dominant_value_interval
    material_checks:
      water: broad_connected_color_field_with_broken_horizontal_or_state_specific_surface_marks
      reflections: loose_vertical_color_paths_interrupted_by_surface_gestures
      depth: overlap_scale_temperature_and_edge_loss_without_invented_horizon_or_three_bands
      accents: sparse_decisive_pads_blossoms_and_glints_not_equal_inventory
    known_failure: >-
      An all-over pond fails when conventional foreground-middle-distance bands
      or a horizon are invented, when every pad is equally described, or when
      the shallow reflection field becomes a tiled ripple pattern.

  - id: horizonless_close_water_and_small_duck
    benchmark: B022
    source_status: consented_private_local_fixture
    invariants:
      - original_wide_crop_orientation_and_downward_viewpoint
      - water_fills_every_edge_without_sky_shoreline_or_horizon
      - exactly_one_small_upper_left_right_facing_duck_with_source_scale_silhouette_and_short_wake
      - selected_compositionally_decisive_debris_anchors_including_the_cropped_lower_right_fragment
      - source_cool_reflected_daylight_and_shallow_all_over_spatial_field
    material_checks:
      water: broad_connected_blue_green_teal_gray_blue_violet_and_indigo_bodies_before_unequal_lateral_oblique_curved_and_hooked_surface_gestures
      reflections: few_broken_chromatic_serpentine_interruptions_not_traced_loop_mesh_or_contour_inventory
      duck: compact_chromatic_planes_with_pale_bill_and_minimal_wake_not_enlarged_centered_outlined_or_described_feather_by_feather
      debris: few_subdued_warm_fragments_and_twigs_with_microdebris_merged_or_omitted_not_speck_inventory
      depth: overlap_local_scale_temperature_pathways_and_selective_edge_loss_without_horizon_or_three_recession_bands
      hierarchy: water_and_reflected_light_first_tiny_duck_second_debris_last
    known_failure: >-
      The result fails when a sky, bank, horizon, lilies, or extra animals are
      invented; when the duck is enlarged, centered, mirrored, redesigned, or
      resolved as an animal portrait; when every photographed squiggle and
      sparkle becomes a wire mesh; when one dash or oval stamp tiles the water;
      or when incidental debris is translated speck by speck. B022 is the
      positive calibration for preserving a tiny factual anchor inside a broad,
      shallow, horizonless light-and-water field.

  - id: silver_overcast_autumn_canopy
    benchmark: B018
    source_status: private_local_fixture
    invariants:
      - original_landscape_crop_orientation_and_sky_left_tree_right_balance
      - roofline_placement_branch_direction_and_major_overlaps
      - source_overcast_light_and_compressed_value_interval
    material_checks:
      sky: broad_quiet_pearl_blue_gray_and_lavender_scumbles_not_smooth_gradient_or_equal_dabs
      canopy: connected_ochre_gold_olive_russet_and_green_masses_before_sparse_leaf_clues
      trunk_and_branches: directional_internally_chromatic_structure_not_black_outline_or_foliage_stamp
      architecture: recognizable_restrained_planar_band_subordinate_to_air_and_canopy
      palette: dominant_autumn_family_with_cool_broad_counter_fields_not_scattered_rainbow_color
    hierarchy_checks:
      - overcast_air_and_collective_canopy_are_the_first_read
      - quiet_sky_gives_the_active_foliage_room_to_breathe
      - architecture_retains_landmark_geometry_without_building_inventory
    known_failure: >-
      The result fails when the sky becomes a blank gradient, the canopy becomes
      leaf-by-leaf stippling, branches turn into flat black outlines, or detailed
      windows and masonry compete with the atmospheric autumn masses.
